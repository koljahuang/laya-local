<style>
  :root { --aws-ink:#161e2d; --aws-blue:#232f3e; --aws-orange:#ff9900; --aws-line:#d5dbdb; }
  body { max-width: 960px; margin: 0 auto; padding: 40px 28px 80px; color: var(--aws-ink); font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  h1, h2, h3 { color: var(--aws-blue); line-height: 1.35; }
  h1 { font-size: 34px; border-bottom: 4px solid var(--aws-orange); padding-bottom: 14px; }
  h2 { margin-top: 44px; border-bottom: 1px solid var(--aws-line); padding-bottom: 8px; }
  h3 { margin-top: 30px; }
  a { color: #0073bb; }
  img, video { display: block; max-width: 100%; height: auto; margin: 24px auto 8px; }
  figure, p:has(> img) { text-align: center; }
  table { width: 100%; border-collapse: collapse; margin: 22px 0; }
  th, td { border: 1px solid var(--aws-line); padding: 9px 11px; vertical-align: top; }
  th { background: #eaeded; color: var(--aws-blue); }
  pre { overflow-x: auto; padding: 16px; background: #f2f3f3; border-left: 4px solid var(--aws-orange); }
  code { font-family: SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  blockquote { margin: 22px 0; padding: 12px 18px; background: #fff7e6; border-left: 4px solid var(--aws-orange); }
  nav#TOC { background:#f7f8f8; border:1px solid var(--aws-line); padding:16px 22px; margin:24px 0 38px; }
  nav#TOC::before { content:"目录"; display:block; font-weight:700; color:var(--aws-blue); margin-bottom:8px; }
  @media (max-width: 700px) { body { padding: 22px 16px 50px; } h1 { font-size: 27px; } }
</style>
